name: Apply product content

# Writes the catalogue copy in src/content/productContent.ts (descriptions,
# features, SEO titles and descriptions) into the production database, so it
# shows up, editable, in the admin product form. Runs only when started by
# hand from the Actions tab: Actions → Apply product content → Run workflow.
#
# Leave "apply" unticked first: that is a dry run which changes nothing and
# lists what would be written and which products still have no SEO copy.
# Only empty fields are filled, so text typed in the admin is never replaced.
#
# Needs the repository secret DATABASE_URL (Settings → Secrets and variables →
# Actions). DIRECT_URL is optional and falls back to DATABASE_URL.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the database (untick for a dry run that changes nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apply-product-content
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dry run
        if: ${{ !inputs.apply }}
        run: npm run content:apply
      - name: Apply
        if: ${{ inputs.apply }}
        run: npm run content:apply -- --apply
