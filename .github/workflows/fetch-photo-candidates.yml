# Temporary (removed before merge): fetches candidate product photos for review.
name: fetch photo candidates
on:
  push:
    branches: ["photos/fetch-candidates"]
    paths: ["photo-candidates/sources.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pymupdf pillow
      - run: python photo-candidates/fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -f photo-candidates/out
          git commit -m "Fetched photo candidates" || echo "nothing new"
          git push
